<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><style>.b{transform-origin:32px 34px;animation:b 4s cubic-bezier(.45,0,.25,1) infinite}.e{animation:e 4s cubic-bezier(.45,0,.25,1) infinite}.o{transform-box:fill-box;transform-origin:center;animation:o 4s cubic-bezier(.45,0,.25,1) infinite}.l,.r,.p,.f{transform-box:fill-box;transform-origin:center;animation:l 4s cubic-bezier(.45,0,.25,1) infinite}.r{animation-name:r}.p{animation-name:p}.f{animation-name:f}@keyframes o{0%,23%,28%,63%,68%,91%,96%,100%{transform:none}25.5%,65.5%,93.5%{transform:scaleY(.1)}}@keyframes b{0%,90%,100%{transform:scale(.95)}10%,40%{transform:scale(.95) rotate(-2deg)}50%,80%{transform:scale(.95) rotate(2deg)}}@keyframes e{0%,90%,100%{transform:none}10%,40%{transform:translate(-7px,-3px)}50%,80%{transform:translate(7px,-3px)}}@keyframes l{0%,90%,100%{transform:none}10%,40%{transform:scaleX(.7)}50%,80%{transform:scaleX(.94)}}@keyframes r{0%,90%,100%{transform:none}10%,40%{transform:scaleX(.94)}50%,80%{transform:scaleX(.7)}}@keyframes f{0%,90%,100%{transform:none}10%,40%{transform:translate(-2.6px,-1px) scaleX(.95)}50%,80%{transform:translate(2.6px,-1px) scaleX(.95)}}@keyframes p{0%,90%,100%{transform:none}10%,40%{transform:translate(-4.5px,-.5px)}50%,80%{transform:translate(2px,-.5px) scaleX(.78)}}@media (prefers-reduced-motion:reduce){.b,.e,.o,.l,.r,.p,.f{animation:none}}</style><g class="b"><circle cx="32" cy="32" r="28" fill="#cfcfd4"/><circle cx="32" cy="32" r="28" fill="none" stroke="#23213a" stroke-opacity=".1"/><g class="f"><circle cx="32" cy="32" r="21.5" fill="#1b1a1d"/></g><g class="e"><g class="l"><g transform="rotate(14 26 30)"><ellipse class="o" cx="26" cy="30" rx="3.2" ry="5" fill="#fff"/></g></g><g class="r"><g transform="rotate(14 38 30)"><ellipse class="o" cx="38" cy="30" rx="3.2" ry="5" fill="#fff"/></g></g></g></g></svg>